<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Listing | KWAREWA</title>
</head>
<body>

    <h1>Edit Listing</h1>
    <p>Update your service or product information.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save Changes</button>
    </form>

    <p>
        <a href="{% url 'my_listings' %}">
            Back to My Listings
        </a>
    </p>

</body>
</html>
