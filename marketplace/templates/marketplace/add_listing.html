{% extends "marketplace/base.html" %}

{% block title %}Publish a listing | KWAREWA{% endblock %}

{% block content %}
<div class="wrap page">
    <div class="page-head">
        <h1>Publish a listing</h1>
        <p>Tell people in Zaria what you offer. Add a clear photo to get more calls.</p>
    </div>

    <form class="form-card" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% include "marketplace/_form_fields.html" %}
        <div class="form-actions">
            <button type="submit" class="btn">Publish listing</button>
            <a class="btn secondary" href="{% url 'home' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
