{% extends "marketplace/base.html" %}

{% block title %}Delete listing | KWAREWA{% endblock %}

{% block content %}
<div class="wrap page">
    <div class="page-head">
        <h1>Delete this listing?</h1>
        <p>This cannot be undone.</p>
    </div>

    <form class="form-card narrow" method="post">
        {% csrf_token %}
        <p><strong>{{ listing.title }}</strong></p>
        <div class="form-actions">
            <button type="submit" class="btn danger">Yes, delete</button>
            <a class="btn secondary" href="{% url 'my_listings' %}">Keep it</a>
        </div>
    </form>
</div>
{% endblock %}
