<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KWAREWA</title>
</head>
<body>
    <h1>Welcome Back</h1>
    <p>Log in to your KWAREWA account.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>

    <p>New to KWAREWA?
        <a href="{% url 'register' %}">Create an account</a>
    </p>

    <p><a href="/">Back to homepage</a></p>
</body>
</html>
