{% extends "marketplace/base.html" %}

{% block title %}Log in | KWAREWA{% endblock %}

{% block content %}
<div class="wrap page">
    <div class="page-head">
        <h1>Welcome back</h1>
        <p>Log in to manage your listings.</p>
    </div>

    <form class="form-card narrow" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {% include "marketplace/_form_fields.html" %}
        <div class="form-actions">
            <button type="submit" class="btn">Log in</button>
        </div>
        <p class="form-foot">New to KWAREWA? <a href="{% url 'register' %}">Create an account</a></p>
    </form>
</div>
{% endblock %}
